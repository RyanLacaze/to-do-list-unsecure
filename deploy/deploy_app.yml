---
# deploy_app.yml - déploiement de la todolist (lancé par le job Jenkins todolist-deploy)
#
#   ansible-playbook deploy_app.yml -i inventory.yaml --limit app-dev \
#       --private-key <clé> -e app_version=<commit> -e deploy_branch=<branche>
#
# RÈGLE : la production (env_type: prod) ne reçoit que la branche main.
#   - imposée ici (tâche "Garde-fou") pour les lancements manuels ;
#   - imposée aussi dans le job Jenkins, qui vérifie en plus que le commit
#     appartient bien à l'historique de main.

- name: Déployer la todolist
  hosts: my_infra
  become: true

  vars:
    app_repo: https://github.com/RyanLacaze/to-do-list-unsecure.git   # ton fork
    app_version: main          # commit ou branche à déployer (Jenkins passe le commit exact)
    deploy_branch: main        # branche d'origine, contrôlée pour la prod
    jenkins_build: manuel      # identifiant du build Jenkins (traçabilité)
    app_dir: /opt/todolist
    app_venv: /opt/todolist/venv
    app_user: todolist
    app_data_dir: /var/lib/todolist
    app_port: 80

  handlers:
    - name: Restart todolist
      ansible.builtin.systemd:
        name: todolist
        state: restarted
        daemon_reload: true

  tasks:
    - name: Garde-fou - la production ne reçoit que la branche main
      ansible.builtin.assert:
        that: deploy_branch == 'main'
        fail_msg: >-
          REFUSÉ : {{ inventory_hostname }} est un serveur de production, seule la branche
          main (code validé) peut y être déployée. Branche demandée : {{ deploy_branch }}
      when: env_type == 'prod'

    - name: Installer les paquets système
      ansible.builtin.apt:
        name: [git, python3-venv, python3-packaging]
        update_cache: true
        cache_valid_time: 3600

    - name: Créer l'utilisateur système de l'application
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_data_dir }}"
        create_home: false

    - name: Créer le dossier des données (base SQLite)
      ansible.builtin.file:
        path: "{{ app_data_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Récupérer le code (commit exact validé par Jenkins)
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_version }}"
        force: true
      notify: Restart todolist

    - name: Installer les dépendances Python (requirements.txt + Gunicorn)
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_venv }}"
        virtualenv_command: python3 -m venv
      notify: Restart todolist

    - name: Installer Gunicorn
      ansible.builtin.pip:
        name: gunicorn
        virtualenv: "{{ app_venv }}"
        virtualenv_command: python3 -m venv
      notify: Restart todolist

    # Code encore "sale" : settings.py a la base et DEBUG en dur.
    # Ces 2 tâches disparaissent à l'exercice 14 (réglages par variables d'environnement).
    - name: Stocker la base SQLite hors du code
      ansible.builtin.replace:
        path: "{{ app_dir }}/todo/settings.py"
        regexp: "'NAME': BASE_DIR / 'db.sqlite3'"
        replace: "'NAME': '{{ app_data_dir }}/db.sqlite3'"
      notify: Restart todolist

    - name: Désactiver DEBUG en production
      ansible.builtin.replace:
        path: "{{ app_dir }}/todo/settings.py"
        regexp: '^DEBUG = True'
        replace: DEBUG = False
      when: not (django_debug | bool)
      notify: Restart todolist

    - name: Appliquer les migrations Django
      ansible.builtin.command:
        cmd: "{{ app_venv }}/bin/python manage.py migrate --noinput"
        chdir: "{{ app_dir }}"
      register: migrate
      changed_when: "'No migrations to apply' not in migrate.stdout"

    - name: Donner la base SQLite à l'utilisateur de l'application
      ansible.builtin.file:
        path: "{{ app_data_dir }}/db.sqlite3"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0640"

    - name: Installer le service systemd todolist
      ansible.builtin.template:
        src: templates/todolist.service.j2
        dest: /etc/systemd/system/todolist.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart todolist

    - name: Activer todolist au démarrage et le lancer
      ansible.builtin.systemd:
        name: todolist
        enabled: true
        state: started
        daemon_reload: true

    - name: Appliquer maintenant les redémarrages en attente
      ansible.builtin.meta: flush_handlers

    - name: Vérifier que la todolist répond (depuis Jenkins)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port }}/"
        status_code: 200
      register: app_check
      until: app_check.status == 200
      retries: 10
      delay: 3
      delegate_to: localhost
      become: false

    - name: Journaliser le déploiement sur le serveur (qui/quoi/quand)
      ansible.builtin.lineinfile:
        path: /var/log/todolist-deployments.log
        line: >-
          {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }} commit={{ app_version }}
          branche={{ deploy_branch }} build={{ jenkins_build }}
        create: true
        owner: root
        group: adm
        mode: "0640"
